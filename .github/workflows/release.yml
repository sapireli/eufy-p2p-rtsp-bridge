name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --experimental-test-coverage --test --test-coverage-include='server.mjs' --test-coverage-include='cli.mjs' --test-coverage-include='src/**/*.mjs' --test-coverage-exclude='src/vendor/**' --test-coverage-include-all --test-coverage-lines=80.01 test/*.test.mjs
        working-directory: server
      - run: npm prune --omit=dev --no-audit --no-fund
        working-directory: server
      - run: deploy/package-release.sh server "$VERSION" "${{ matrix.arch }}" dist
        env:
          VERSION: ${{ github.ref_name }}
      - run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          archive=$(ls ./*.tar.gz)
          digest=$(sha256sum "$archive")
          bash ../deploy/install-server.sh --artifact "$archive" --checksums SHA256SUMS --trusted-sha256 "${digest%% *}" --verify-only
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  client:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/tests -p 'test_qualify_client.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgstreamer1.0-0 gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-x libdrm-tests ffmpeg xvfb
      - run: go test ./... -race -coverprofile=coverage.out
        working-directory: client
      - run: go tool cover -func=coverage.out | awk '$1 == "total:" { seen=1; value=$3; sub(/%/, "", value); print "Go coverage:", value "%"; if (value <= 80) exit 1 } END { if (!seen) exit 1 }'
        working-directory: client
      - run: make pi1 pi3 pi64 amd64
        working-directory: client
      - run: bash deploy/tests/test-linux-systemd-install.sh
      - run: bash deploy/tests/test-packaged-client-live-linux.sh
        timeout-minutes: 8
      - run: |
          for arch in armv6 armv7 arm64 amd64; do
            deploy/package-release.sh client "$VERSION" "$arch" dist
          done
        env:
          VERSION: ${{ github.ref_name }}
      - run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          for archive in ./*.tar.gz; do
            case "$archive" in *-linux-amd64.tar.gz)
              digest=$(sha256sum "$archive")
              bash ../deploy/install-client.sh --artifact "$archive" --checksums SHA256SUMS --trusted-sha256 "${digest%% *}" --verify-only
            ;; esac
          done
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: dist/*.tar.gz
          if-no-files-found: error
  macos-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: brew install gstreamer
      - run: bash deploy/tests/test-install-client-macos.sh
      - run: go test ./... -race
        working-directory: client
      - run: make darwin
        working-directory: client
      - run: bash deploy/tests/test-packaged-client-macos.sh
      - run: deploy/package-release.sh client "$VERSION" "darwin-${{ matrix.arch }}" dist
        env:
          VERSION: ${{ github.ref_name }}
      - run: |
          cd dist
          shasum -a 256 ./*.tar.gz > SHA256SUMS
          archive=$(ls ./*.tar.gz)
          digest=$(shasum -a 256 "$archive")
          bash ../deploy/install-client-macos.sh --artifact "$archive" --checksums SHA256SUMS --trusted-sha256 "${digest%% *}" --verify-only
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: [server, client, macos-client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          # Mac artifacts remain Actions test artifacts until Developer ID signing,
          # notarization, and clean-host qualification are configured.
          sha256sum ./*-linux-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$VERSION" ./*-linux-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
