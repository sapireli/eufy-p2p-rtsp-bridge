# eufy-wall display configuration. Replace bridge.local and camera serials.
schema_version: 2
bridge_url: http://bridge.local:3000   # HTTP and WebSocket control endpoint
rtsp_base: rtsp://bridge.local:8554     # go2rtc RTSP endpoint
# output: HDMI-A-1                     # DRM connector; omit for the first connected display
# screen: {width: 1920, height: 1080}  # omit to detect the connected output's mode
layout: custom
canvas: {cols: 32, rows: 32}
decoder: auto                          # auto | v4l2 | va | software
sink: auto                             # auto | planes | compositor | window
# planes: [31, 32]                     # needed when sink resolves to planes
latency_ms: 200
tiles:
  - id: garage
    camera: T8425XXXXXXXXXXX          # camera serial, not display name or stream key
    rect: {x: 0, y: 0, w: 16, h: 32}  # integer, half-open grid rectangle
  - id: front-door
    camera: T8214XXXXXXXXXXX
    rect: {x: 16, y: 0, w: 16, h: 32}
# Motion tile example: replace one fixed tile with:
#  - id: recent-motion
#    motion: latest
#    watch: [T81A0XXXXXXXXXXX]
#    blank_after_seconds: 90
#    dwell_seconds: 5
#    rect: {x: 16, y: 0, w: 16, h: 32}
# Fixed on_demand tiles refresh a bounded server hold while visible; fixed on_motion tiles sleep
# between events. The bridge reports each camera's codec; tile.codec is an offline fallback.
restart: {min_seconds: 1, max_seconds: 30, stable_seconds: 60}
