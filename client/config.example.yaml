# eufy-wall display client configuration (/etc/eufy-wall.yaml)
# Camera power_override and LAN peer policy belong in the bridge server config. This client receives
# each camera's stream state and mode from the server; its tile rules follow those values.
rtsp_base: auto   # discover _eufy-wall._tcp; or use a hostname, e.g. rtsp://homebridge.lan:8554
# output: HDMI-A-1                     # DRM connector this instance drives; omit = first connected.
# TWO MONITORS: run one instance per monitor, each with its own config file, its own `output:` and its
# own `tiles:`. Each drives its own CRTC and keeps the cheap hardware-plane path. Do NOT span one
# framebuffer across both — DRM overlay planes belong to a single CRTC, so spanning forces the
# compositor path and roughly doubles the composite work. List connectors with:
#   ls /sys/class/drm/            (card0-HDMI-A-1, card0-HDMI-A-2, card0-DP-1, ...)
layout: 2x1                            # 1 | 1+5 | 2tall+3wide | <cols>x<rows> (sides 1-6)
# Common shapes on a 16:9 screen:
#   2x1  two side by side, full height. The fit for two dual-lens cameras: they compose a PORTRAIT
#        stream (e.g. 1600x2200, 1920x2160), and two of those fill ~91% of the width — a third will
#        not fit beside them without shrinking the pair.
#   3x1  three across, full height (portrait tiles letterbox to fit the narrower column)
#   2x2  four tiles; a tile with `aspect: tall` takes a full-height column
#   1x2  stacked pair, for a rotated panel
#   1+5  one 2x2 primary plus five 1x1 tiles in a 3x3 grid (see primary_position)
#   2tall+3wide  first two tiles each take 35% width at full height; the remaining
#        1-3 tiles share the right 30% equally from top to bottom. Requires 2-5 tiles;
#        with two tiles the right column is black. Positions follow tiles order;
#        aspect/role do not reorder tiles and explicit span overrides are rejected.
primary_position: left                 # 1+5 only: left | right
# screen: { width: 1920, height: 1080 }  # omit → auto-detect from /sys/class/drm
decoder: auto                          # auto | v4l2 (Pi) | va (x86 VAAPI) | software
# Hardware is tried first. On actual decoder resource exhaustion, a higher-ranked camera can
# move one lower-ranked, unpinned camera to software. Pins cannot be displaced by another camera.
# Identity is the bridge camera serial/key (including cameras a motion tile may follow).
# hardware_pinned_cameras: [T8214XXXXXXXXXXX, T8425XXXXXXXXXXX]
# hardware_priority: { T8214XXXXXXXXXXX: 100, T8425XXXXXXXXXXX: 50 }   # higher wins; omitted = 0
sink: auto                             # auto | planes (Pi, one kmssink per tile) | compositor | window (dev)
# planes: [31, 32, 33, 34, 35, 36]     # DRM overlay plane ids for sink=planes → `modetest -M vc4 -p`
latency_ms: 0                           # TCP; eufypacing supplies one bounded 67ms decoded-frame allowance
motion_flash: true                      # DRM planes: flash the matching camera tile on each motion event
# Omit to use the bridge's per-camera RTSP/TCP packet-size hint for generated URLs.
# Explicit tile URLs stay unchanged unless this override is set. This changes
# packetization, not video quality, frame rate, or buffering. Requires server support.
# rtsp_packet_size: 8192              # 256..65535; 0 disables automatic tuning
# MOTION TILES. A tile with `motion: latest` follows whichever watched camera moved most recently,
# instead of being pinned to one camera. Two behaviours fall out of it:
#   follow          — a tile inside a normal layout that swaps to whatever just moved
#   magic screen    — `layout: 1` with one motion tile and blank_after_seconds: a screen that is DARK
#                     until something moves, then lights up, then goes dark again
# watch is any set of cameras, not just battery ones: a wired camera costs nothing extra here because
# it is already streaming, so the tile just switches URL.
#
#   - motion: latest
#     watch: [T81A0XXXXXXXXXXX, T8425XXXXXXXXXXX]   # omit to watch every camera
#     blank_after_seconds: 90                       # nothing recent → show nothing (0 = never blank)
#     dwell_seconds: 5                              # minimum time on a camera, so it cannot strobe
#
# A FIXED tile for a battery camera needs no extra config: it shows that camera's last snapshot while it
# sleeps and swaps to live on its own when motion wakes it. It does not hold the camera awake — the
# server wakes it on motion, and a tile that asked would pin it awake for as long as the wall has power.
#
# A MOTION tile does hold, for as long as it is watching. On motion it puts the snapshot up immediately
# and the live stream replaces it a second or two later, so neither step shows a black tile. Nothing
# retained yet (a camera that has never reported motion) means a dark tile until there is.
#
# codec: auto/unset selects an advertised native HEVC rendition only when a
# hardware HEVC factory explicitly lists the source profile/level/tier tuple. Its pipeline falls back once to the compatible
# URL if negotiation/playback fails. Explicit h264/h265 and manual URLs win.
# decoder: software disables automatic native preference. Factory presence
# alone is insufficient; missing level/tier caps retain compatible H.264.
# Resolution and successful initialization still require runtime negotiation.
# codec: an explicit value says what the configured URL actually sends.
#   h264 pins the compatible bridge URL. auto/omitted may use its optional native URL.
#   h265 is for an explicit URL known to carry HEVC or a separately configured
#   pass-through bridge; it does not rewrite the compatible URL to a native URL.
#   The bridge's compatible default remains H.264. Check actual installed hardware
#   factories with gst-inspect-1.0 before assuming native HEVC is available.
tiles:                                 # order = placement order (row-major after the primary)
  - { camera: T8425XXXXXXXXXXX, codec: auto }   # Garage     (dual-lens → portrait; native when supported)
  - { camera: T8214XXXXXXXXXXX }                # Front Door (dual-lens → portrait; compatible fallback)
  # A third camera does not fit beside those two on 16:9. Options: give it its own screen, use 3x1
  # (all three narrower), or 2x2 with the pair marked `aspect: tall` and the third in a spare cell.
restart: { min_seconds: 1, max_seconds: 30, stable_seconds: 60 }
