# eufy-wall-bridge configuration. Copy to config.yaml (or set BRIDGE_CONFIG). Secrets may instead come
# from the environment: EUFY_EMAIL, EUFY_PASSWORD, EUFY_COUNTRY (env wins over this file).
eufy:
  email: wall@example.com        # use a DEDICATED eufy account (eufy allows one login per account;
  password: change-me            # the phone app on the same account evicts the bridge)
  country: US

host: 0.0.0.0                    # HTTP bind (go2rtc + display clients + curl)
port: 3000
# self_host: 127.0.0.1           # address go2rtc uses to pull /stream from this process
# data_dir: ./data               # session token + generated go2rtc.yaml
# go2rtc_bin: go2rtc             # path to the go2rtc binary
# poll_ms: 600000                # cloud state poll interval (SDK default 10 min)

lan:
  cidr: 192.168.1.0/24           # your LAN
  force: true                    # SDK refuses public IPv4 peers; bridge checks cidr on control and media sessions
  station_addresses: {}          # optional LAN IP hints keyed by HomeBase/station serial, e.g. T8010XXXX: 192.168.1.50

# Both of these are UNSET by default, and unset means the bridge writes nothing to the camera.
# Streaming quality and dual-lens view belong to the eufy app, where only the owner account can change
# them — and writing one from here is a command sent to a camera that may be mid-stream. Set them only if
# you want the bridge to force the setting rather than follow what the app already says.
# defaults:
#   quality: "Full HD (1080P)"   # live-view tier. Values: "HD (720P)" | "Full HD (1080P)" | "Max"
#   dual_view: split             # dual-lens cameras: split | pip-tl | pip-tr | pip-bl | pip-br | single

cameras:                         # keyed by camera serial; unlisted WIRED cameras are included, BATTERY excluded
  T8410XXXXXXXXXXX: { name: Garage }
  T8214XXXXXXXXXXX: { name: Front door }
  T8113XXXXXXXXXXX: { enabled: false }
  # `codec:` (h264 | h265) declares what a camera sends so automatic transcoding can be selected before
  # its first frame. Passthrough streams use go2rtc's raw HTTP source without an ffmpeg probe.
  # Otherwise the codec is learned from the live feed; a feed that disagrees with this value wins.
  T8423XXXXXXXXXXX: { name: Balcony, codec: h265 }

# stall:                         # media watchdog (defaults shown)
#   stall_ms: 30000              # no bytes for this long → restart the feed
#   gap_ms: 45000                # consumers are disconnected after this long without bytes
#   exit_after_ms: 300000        # continuous failure this long → exit(1) so systemd restarts us
#   backoff_ms: [1000, 2000, 4000, 8000]

# go2rtc egress. "never" (default) passes every camera's own bitstream through directly — the wall
# decodes H.265 in hardware, so re-encoding on the bridge gains nothing and even hardware encoders could
# not hold real time for the 2160p HEVC cameras (VideoToolbox measured 0.9x; go2rtc kills a producer that
# falls behind, taking the stream down mid-view). "auto" transcodes H.265 to H.264 for players with no
# HEVC decoder; "always" transcodes everything. Both are hardware-only: a CPU transcode is never emitted.
#
# Several eufy models encode H.265 at every quality tier, so a passthrough wall must decode HEVC itself
# (client tile `codec: h265`). VLC plays these with --rtsp-tcp.
go2rtc:
  transcode: never                     # never (default) | auto | always

# When each camera streams. The SDK's automatic policy budgets a battery device even while charging:
# mains-only → always, battery → on_motion. A continuous battery stream requires an explicit local
# power_override: always-on claim; the bridge refuses mode: always without it.
#   always     stream continuously
#   on_motion  idle until an event takes a hold on it
#   on_demand  stream only while something is watching
# hold_seconds bounds how long motion keeps a camera up; further motion extends it.
#
# power_override changes SDK stream/session limits without writing to the device. Set it only when the
# installation can support a persistent stream; auto clears the claim, battery forces battery limits.
# cameras:
#   T8000P0000000000: { power_override: always-on, mode: always }  # synthetic serial
#   T81A0XXXXXXXXXXX: { mode: on_motion, hold_seconds: 60 }
#
# defaults:
#   hold_seconds: 60
#   motion_events: [motion, personDetected, doorbellPress]
